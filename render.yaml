services:
  - type: web
    name: price-signal
    runtime: python
    plan: free
    buildCommand: pip install -r web/requirements.txt gunicorn && python web/build_db.py
    startCommand: gunicorn --chdir web --bind 0.0.0.0:$PORT --workers 1 server:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
