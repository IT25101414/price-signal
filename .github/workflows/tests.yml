name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.lock -r web/requirements.lock
      - run: python -m pytest -q
      - run: python refusal_report.py
      - run: python web/accessibility_check.py
      - run: python rolling_stress_check.py data/recent_prices.csv --strict
